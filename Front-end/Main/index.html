<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analog Clock</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>


  <header class="topbar">
    <h1>Scheduler</h1>
    <div class="topbar-actions">
      <a class="back-btn" href="/Features/schedular/manage.html">Manage Tasks</a>
      <a class="back-btn" href="/Main/index.html">← Back to Clock</a>
    </div>
  </header>

  <a class="nav-btn" href="/Features/schedular/scheduler.html">Scheduler</a>

  <main class="clock">
    <div class="face" id="face" role="img" aria-label="Analog clock face">
      <!-- Tick marks are generated by script.js -->

      <div class="hand hand--hour" id="hourHand"></div>
      <div class="hand hand--minute" id="minuteHand"></div>
      <div class="hand hand--second" id="secondHand"></div>
      <div class="center-dot"></div>
    </div>

    <div class="readout">
      <p class="digital" id="digital">--:--:--</p>
      <p class="date" id="date"></p>
    </div>
  </main>

  <script src="index.js"></script>
</body>

</html>
