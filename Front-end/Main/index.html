<!-- index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analog Clock</title>

  <!-- toggle script for switching between Dark mode and Light mode -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) {
          t = window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches
            ? "light" : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t;
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="index.css" />
  <link rel="stylesheet" href="/Global/themes/themes.css" />
</head>

<body>



  <a class="nav-btn" href="/Features/schedular/scheduler.html">Scheduler</a>

  <main class="clock">
    <div class="face" id="face" role="img" aria-label="Analog clock face">
      <!-- Tick marks are generated by script.js -->

      <div class="hand hand--hour" id="hourHand"></div>
      <div class="hand hand--minute" id="minuteHand"></div>
      <div class="hand hand--second" id="secondHand"></div>
      <div class="center-dot"></div>
    </div>

    <div class="readout">
      <p class="digital" id="digital">--:--:--</p>
      <p class="date" id="date"></p>
    </div>
  </main>

  <script src="/Global/themes/themes.js"></script>
  <script src="index.js"></script>
</body>

</html>
